spring:
  application:
    name: gateway

  cloud:
    gateway:
      routes:
        # ── Vehículos ─────────────────────────────────
        - id: vehiculos-route
          uri: lb://automotora          # lb:// = load balancer via Eureka
          predicates:
            - Path=/api/vehiculos/**
          filters:
            - AddRequestHeader=X-Gateway-Source, automotora-gateway

        # ── TipoVehiculo ──────────────────────────────
        - id: tipovehiculo-route
          uri: lb://automotora
          predicates:
            - Path=/tipovehiculos/**
          filters:
            - AddRequestHeader=X-Gateway-Source, automotora-gateway

        # ── Clientes ──────────────────────────────────
        - id: clientes-route
          uri: lb://automotora
          predicates:
            - Path=/api/clientes/**
          filters:
            - AddRequestHeader=X-Gateway-Source, automotora-gateway

        # ── Vendedores ────────────────────────────────
        - id: vendedores-route
          uri: lb://automotora
          predicates:
            - Path=/api/vendedores/**
          filters:
            - AddRequestHeader=X-Gateway-Source, automotora-gateway

        # ── Ventas ────────────────────────────────────
        - id: ventas-route
          uri: lb://automotora
          predicates:
            - Path=/api/ventas/**
          filters:
            - AddRequestHeader=X-Gateway-Source, automotora-gateway

        # ── Swagger UI del microservicio ──────────────
        - id: swagger-route
          uri: lb://automotora
          predicates:
            - Path=/doc/**,/v3/api-docs/**,/swagger-ui/**

# Eureka Client — el Gateway se registra y consulta Eureka
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true

server:
  port: 8090

management:
  endpoints:
    web:
      exposure:
        include: health, info, gateway
  endpoint:
    health:
      show-details: always

logging:
  level:
    "[org.springframework.cloud.gateway]": DEBUG